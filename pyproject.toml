[project]
name = "naive-bayes-classifier"
version = "0.1.0"
description = "A Naive Bayes Classifier for zoo animals, built from scratch"
readme = "README.md"
authors = [
    { name = "Joey Pandina", email = "joey13pandina@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
]

[project.scripts]
naive-bayes-classifier = "naive_bayes_classifier:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
